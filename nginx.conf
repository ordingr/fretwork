server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # the web root is the repo root, so keep the plumbing out of it
    location ~ /\.            { deny all; }
    location ~* \.(ya?ml|conf|md)$ { deny all; }

    location = /manifest.webmanifest { default_type application/manifest+json; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
